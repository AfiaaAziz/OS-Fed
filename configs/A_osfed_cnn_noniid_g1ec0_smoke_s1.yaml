# OS-Fed smoke + Step 8.10 tuning config. Small CNN, grid 1 (M=1), error comp OFF.
# Plan Step 8.4 says build and test M=1 first, then M=2, then M=4.
purpose: "OS-Fed smoke / snapshot tuning (M=1, no error comp), 1 round"
tier: A
method: osfed
model: cnn
norm: batch                 # ignored by the cnn (no normalization layers)
partition: cifar10_dir0.5_c10_seed100
n_clients: 2
samples_per_client: 500     # keep tuning fast on the CPU VM
rounds: 1
local_epochs: 5
batch_size: 64              # D1
lr: 0.01
lr_schedule: cosine         # D3
momentum: 0.0               # D2
weight_decay: 0.0           # D2
seed: 1
aggregation: uavg           # OS-Fed ignores this (server uses Eq. 3, equal weight); kept so run_single's required-key check passes

# --- OS-Fed settings (project decisions; "not stated" in the paper main text) ---
grid_size: 1                # M=1 to start (plan 8.4). Change to 4 later for the CIFAR default.
lbfgs_max_iter: 20          # D5 placeholder; tuning will tell us the right value
lbfgs_lr: 1.0               # L-BFGS default step
snapshot_eps: 1.0e-8        # D6
snapshot_init: first_client_image   # D4 placeholder; tuning compares this vs random
error_compensation: false   # ec0 variant
snapshot_shape: [3, 32, 32] # D11 (inferred from Table 2)
num_classes: 10
