purpose: OS-Fed smoke / snapshot tuning (M=1, no error comp), 1 round
tier: A
method: osfed
model: cnn
norm: batch
partition: cifar10_dir0.5_c10_seed100
n_clients: 2
samples_per_client: 500
rounds: 1
local_epochs: 5
batch_size: 64
lr: 0.01
lr_schedule: cosine
momentum: 0.0
weight_decay: 0.0
seed: 1
aggregation: uavg
grid_size: 4
lbfgs_max_iter: 20
lbfgs_lr: 1.0
snapshot_eps: 1.0e-08
snapshot_init: first_client_image
error_compensation: false
snapshot_shape:
- 3
- 32
- 32
num_classes: 10
